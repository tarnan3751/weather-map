[package]
name = "wx-alerts"
description = "Official weather alerts (NWS and worldwide CAP feeds) in PostGIS, vector tiles, saved places, and Web Push notifications"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
wx-core = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# Feeds and CAP documents. Pure Rust; it never resolves external entities.
quick-xml = "0.41"

# Web Push crypto: one RustCrypto stack, no OpenSSL.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22"
getrandom = "0.3"
hkdf = "0.13"
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdh", "ecdsa", "std"] }
sha2 = "0.11"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = "0.3"
