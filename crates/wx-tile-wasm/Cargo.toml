[package]
name = "wx-tile-wasm"
description = "The WXT1 decoder behind a plain C ABI, for the browser as WebAssembly"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# cdylib for the .wasm; rlib so the host test harness can link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
wx-tile = { workspace = true }

# The .wasm is built with the `wasm-release` profile from the workspace root
# (Cargo only honours profiles there); see web/scripts/build-wasm.mjs.
